name: Monitoring onkologii dziecięcej

on:
  workflow_dispatch:

  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: monitoring-onkologii
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Instalacja Chromium
        run: npx playwright install chromium --with-deps

      - name: Uruchom monitoring
        run: node scripts/update-news.mjs

      - name: Budowanie Astro
        run: npm run build

      - name: Commit zmian
        run: |
          if git diff --quiet -- src/data/auto-publications.json; then
            echo "Brak nowych publikacji."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/auto-publications.json
          git commit -m "Automatyczna aktualizacja publikacji"

          git push
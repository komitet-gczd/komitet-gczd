name: Aktualizacja publikacji

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5,17 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Pobierz nowe publikacje
        run: node scripts/update-news.mjs

      - name: Sprawdź stronę
        run: npm run build

      - name: Zapisz zmiany
        run: |
          if git diff --quiet; then
            echo "Brak nowych publikacji."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/auto-publications.json
          git commit -m "Automatyczna aktualizacja publikacji"
          git push